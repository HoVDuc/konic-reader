<!DOCTYPE html>
<html>

<head>
    <title>{{ album_name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/viewer.css') }}">
</head>

<body>
    <header>
        <div class="nav-left"><a href="{{ url_for('album.details', type='album', id=album_id) }}" class="back-btn"><i
                    class="fas fa-arrow-left"></i></a>
            <div class="title">{{ album_name }}</div>
        </div>
        <div class="chap-nav"><a href="{{ url_for('album.view_album', id=prev_id) if prev_id else '#' }}"
                class="nav-btn {{ 'disabled' if not prev_id }}"><i class="fas fa-chevron-left"></i></a><a
                href="{{ url_for('album.view_album', id=next_id) if next_id else '#' }}"
                class="nav-btn {{ 'disabled' if not next_id }}"><i class="fas fa-chevron-right"></i></a></div>
    </header>
    <div id="viewer-container">
        <div class="image-container">
            {% for img in images %}<img class="page-img"
                src="{{ url_for('album.get_image', album_id=album_id, filename=img.filename) }}" loading="lazy">{% endfor %}
        </div>
        <div class="bottom-nav">{% if prev_id %}<a href="{{ url_for('album.view_album', id=prev_id) }}"
                class="big-btn btn-prev"><i class="fas fa-arrow-left"></i> Chap Trước</a>{% endif %}{% if next_id %}<a
                href="{{ url_for('album.view_album', id=next_id) }}" class="big-btn btn-next">Chap Sau <i
                    class="fas fa-arrow-right"></i></a>{% endif %}</div>{% if not next_id and not prev_id %}<div
            style="color:#777;margin-top:20px">Hết danh sách</div>{% endif %}
    </div>
    <footer><button class="zoom-btn" onclick="zoom(-10)">-</button><span id="zoom-level">100%</span><button
            class="zoom-btn" onclick="zoom(10)">+</button></footer>
    <div id="click-layer">
        <div id="prev-area"></div>
        <div id="center-area"></div>
        <div id="next-area"></div>
    </div>

    <a href="{{ url_for('main.index') }}" id="home-fab" title="Về trang chủ"><i class="fas fa-home"></i></a>

    <script>
        let currentWidth = 100;
        let lastScrollTop = 0;
        const homeFab = document.getElementById('home-fab');

        window.addEventListener('scroll', function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 50) {
                // Scroll down
                header.style.transform = 'translateY(-100%)';
                footer.style.transform = 'translateY(100%)';
                homeFab.style.opacity = '0';
                homeFab.style.pointerEvents = 'none';
            } else {
                // Scroll up
                header.style.transform = 'translateY(0)';
                footer.style.transform = 'translateY(0)';
                homeFab.style.opacity = '1';
                homeFab.style.pointerEvents = 'auto';
            }
            lastScrollTop = scrollTop;
        });

        function zoom(delta) {
            currentWidth += delta;
            if (currentWidth < 20) currentWidth = 20;
            if (currentWidth > 300) currentWidth = 300;
            document.getElementById('zoom-level').textContent = currentWidth + '%';
            document.querySelectorAll('.page-img').forEach(img => {
                img.style.width = currentWidth + '%'
            })
        }

        document.addEventListener('keydown', function (event) {
            if (event.key === "ArrowLeft") {
                {% if prev_id %}
                window.location.href = "{{ url_for('album.view_album', id=prev_id) }}";
                {% endif %}
            } else if (event.key === "ArrowRight") {
                {% if next_id %}
                window.location.href = "{{ url_for('album.view_album', id=next_id) }}";
                {% endif %}
            }
        });

        const header = document.querySelector('header');
        const footer = document.querySelector('footer');
        const prevArea = document.getElementById('prev-area');
        const centerArea = document.getElementById('center-area');
        const nextArea = document.getElementById('next-area');

        centerArea.addEventListener('click', () => {
            header.hidden = !header.hidden;
            footer.hidden = !footer.hidden;
        });

        prevArea.addEventListener('click', () => {
            {% if prev_id %}
            window.location.href = "{{ url_for('album.view_album', id=prev_id) }}";
            {% endif %}
        });

        nextArea.addEventListener('click', () => {
            {% if next_id %}
            window.location.href = "{{ url_for('album.view_album', id=next_id) }}";
            {% endif %}
        });

    </script>
</body>

</html>
